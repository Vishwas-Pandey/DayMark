services:
  frontend:
    build:
      context: ./web
    ports:
      - "80:80"
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/daymark
      - CORS_ORIGIN=http://localhost
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      - AI_PROVIDER=${AI_PROVIDER:-MOCK}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongo
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
